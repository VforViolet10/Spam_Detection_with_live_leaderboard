<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spam Detection Leaderboard</title>

<style>
body{
font-family:Arial,sans-serif;
padding:40px;
background:#f5f7fb;
}

h1{
text-align:center;
margin-bottom:10px;
}

/* Metric cards */
.stats-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:30px auto;
}

.stat-card{
background:white;
padding:20px 30px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
font-size:22px;
font-weight:bold;
text-align:center;
min-width:220px;
}

.stat-card span{
display:block;
margin-top:12px;
font-size:32px;
color:#0a8f3d;
}

table{
width:90%;
margin:auto;
border-collapse:collapse;
background:white;
box-shadow:0 2px 15px rgba(0,0,0,.1);
border-radius:10px;
overflow:hidden;
}

th,td{
padding:16px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1f2937;
color:white;
font-size:17px;
}

tr:hover{
background:#f8fafc;
}

.gold{
background:#fff7cc;
font-weight:bold;
}

.silver{
background:#eef2f7;
font-weight:bold;
}

.bronze{
background:#fde6d0;
font-weight:bold;
}
</style>
</head>

<body>

<h1>📊 Spam Detection Challenge Leaderboard</h1>

<div class="stats-container">

<div class="stat-card">
🏆 Best Accuracy
<span id="bestAccuracy">Loading...</span>
</div>

<div class="stat-card">
🎯 Best Precision
<span id="bestPrecision">Loading...</span>
</div>

<div class="stat-card">
📈 Best Recall
<span id="bestRecall">Loading...</span>
</div>

<div class="stat-card">
🔥 Best F1 Score
<span id="bestF1">Loading...</span>
</div>

</div>

<table id="leaderboard">
<thead>
<tr>
<th>Rank</th>
<th>Team</th>
<th>Accuracy</th>
<th>Precision</th>
<th>Recall</th>
<th>F1 Score</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

fetch('leaderboard.csv')
.then(response => response.text())
.then(data => {

let rows=data.trim().split('\n').slice(1)
let tbody=document.querySelector('tbody')

let entries=rows.map(r=>{
let c=r.split(',')
return{
team:c[1],
accuracy:parseFloat(c[2]),
precision:parseFloat(c[3]),
recall:parseFloat(c[4]),
f1:parseFloat(c[5])
}
})

/* Sort by F1 */
entries.sort((a,b)=>b.f1-a.f1)

/* Best metrics cards */
document.getElementById("bestAccuracy").innerText=
Math.max(...entries.map(e=>e.accuracy)).toFixed(4)

document.getElementById("bestPrecision").innerText=
Math.max(...entries.map(e=>e.precision)).toFixed(4)

document.getElementById("bestRecall").innerText=
Math.max(...entries.map(e=>e.recall)).toFixed(4)

document.getElementById("bestF1").innerText=
Math.max(...entries.map(e=>e.f1)).toFixed(4)

/* Leaderboard rows */
entries.forEach((e,index)=>{

let tr=document.createElement('tr')

if(index===0) tr.classList.add('gold')
if(index===1) tr.classList.add('silver')
if(index===2) tr.classList.add('bronze')

let medal=""
if(index===0) medal="🥇"
else if(index===1) medal="🥈"
else if(index===2) medal="🥉"
else medal=index+1

let row=[
medal,
e.team,
e.accuracy.toFixed(4),
e.precision.toFixed(4),
e.recall.toFixed(4),
e.f1.toFixed(4)
]

row.forEach(val=>{
let td=document.createElement('td')
td.innerHTML=val
tr.appendChild(td)
})

tbody.appendChild(tr)

})

})

</script>

</body>
</html>
